name: ENiGMA CAM v0.9 Playback Recovery
on:
  push:
    branches: [enigma-cam-v09-playback-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile standalone camera APK
        run: gradle --no-daemon -p camera_standalone :app:assembleDebug --stacktrace
      - name: Validate APK signature and package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp camera_standalone/app/build/outputs/apk/debug/app-debug.apk dist/ENiGMA_CAM_v0.9-RTSP-Recovery.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v dist/ENiGMA_CAM_v0.9-RTSP-Recovery.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/ENiGMA_CAM_v0.9-RTSP-Recovery.apk | grep -F "package: name='art.enigma.cam.diagnostics'"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ENiGMA-CAM-v09-playback-recovery
          path: dist/
          retention-days: 30
